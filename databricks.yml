# Databricks Asset Bundle (DAB) - deploy declarativo do pipeline.
#
# Uso local:
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run nyc_taxi_pipeline -t dev
#
# Autenticacao (host + token) vem das variaveis de ambiente
# DATABRICKS_HOST e DATABRICKS_TOKEN. No CI elas sao injetadas a partir dos
# secrets do GitHub; localmente use `databricks configure` (profile) ou
# exporte as variaveis. Por isso o `host` NAO fica fixo neste arquivo.
#
# Alvo: Databricks Free Edition (Unity Catalog + serverless).

bundle:
  name: nyc_taxi_trips

include:
  - resources/*.yml

# Variaveis do bundle. O warehouse_id (SQL warehouse que roda as queries do
# dashboard) e resolvido automaticamente pelo NOME do warehouse via `lookup`,
# entao voce nao precisa descobrir/gerenciar o ID manualmente. No Databricks
# Free Edition o warehouse pre-criado se chama "Serverless Starter Warehouse".
# Se o seu warehouse tiver outro nome, ajuste em `targets.<t>.variables` abaixo
# ou passe explicitamente com `--var="warehouse_name=<nome>"`.
variables:
  warehouse_name:
    description: Nome do SQL warehouse usado para executar as queries do dashboard Lakeview.
    default: "Serverless Starter Warehouse"
  warehouse_id:
    description: ID do SQL warehouse (resolvido automaticamente a partir de warehouse_name).
    lookup:
      warehouse: ${var.warehouse_name}

# O .lvdash.json e implantado pela resource `dashboards` (nao deve ser
# sincronizado como arquivo bruto no workspace).
sync:
  exclude:
    - resources/*.lvdash.json

targets:
  dev:
    mode: development
    default: true
