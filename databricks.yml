# Databricks Asset Bundle (DAB) - deploy declarativo do pipeline.
#
# Uso local:
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run nyc_taxi_pipeline -t dev
#
# Autenticacao (host + token) vem das variaveis de ambiente
# DATABRICKS_HOST e DATABRICKS_TOKEN. No CI elas sao injetadas a partir dos
# secrets do GitHub; localmente use `databricks configure` (profile) ou
# exporte as variaveis. Por isso o `host` NAO fica fixo neste arquivo.
#
# Alvo: Databricks Free Edition (Unity Catalog + serverless).

bundle:
  name: nyc_taxi_trips

include:
  - resources/*.yml

# Variaveis do bundle. O warehouse_id (SQL warehouse que roda as queries do
# dashboard) muda por workspace, entao nao fica fixo: no CI e injetado via
# BUNDLE_VAR_warehouse_id (secret DATABRICKS_WAREHOUSE_ID); localmente use
# `--var="warehouse_id=<id>"`.
variables:
  warehouse_id:
    description: ID do SQL warehouse usado para executar as queries do dashboard Lakeview.

# O .lvdash.json e implantado pela resource `dashboards` (nao deve ser
# sincronizado como arquivo bruto no workspace).
sync:
  exclude:
    - resources/*.lvdash.json

targets:
  dev:
    mode: development
    default: true
