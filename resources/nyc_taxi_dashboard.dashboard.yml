resources:
  dashboards:
    nyc_taxi_dashboard:
      display_name: "Análise dos táxis de NY - Teste de Deploy"

      # Arquivo .lvdash.json (Lakeview) versionado junto ao bundle. O caminho e
      # relativo a este arquivo YAML.
      file_path: ./nyc_taxi_dashboard.lvdash.json

      # warehouse_id e resolvido automaticamente pelo NOME do warehouse (variavel
      # warehouse_name, default "Serverless Starter Warehouse" no Free Edition)
      # via lookup no databricks.yml. Nao precisa saber o ID. Para usar outro
      # warehouse: databricks bundle deploy -t dev --var="warehouse_name=<nome>"
      warehouse_id: ${var.warehouse_id}
